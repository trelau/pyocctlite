# Runs the conda env's own tools so versions match and mypy sees the generated _occtlite.pyi.
# Setup once per clone: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
