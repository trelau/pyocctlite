repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c++]
      - id: gen-api
        name: generate API listing
        entry: python docs/gen_api.py
        language: system
        files: ^(pyocctlite/.*\.py|docs/gen_api\.py|docs/pyocctlite-api\.md)$
        pass_filenames: false
